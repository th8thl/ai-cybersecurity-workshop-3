name: Workshop security checks
on: [push, pull_request]
jobs:
  workshop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [starter, solution]
    env:
      DJANGO_SECRET_KEY: ci-disposable-secret-key-not-a-deployment-secret
      RAG_EMBEDDING_PROVIDER: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ${{ matrix.app }}/requirements.txt
      - run: python -m pip install -r ${{ matrix.app }}/requirements.txt
      - name: Verify documented workshop state
        working-directory: ${{ matrix.app }}
        run: python scripts/verify_workshop.py
      - name: Measure context boundary limitations
        working-directory: ${{ matrix.app }}
        run: python scripts/evaluate_rag.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ matrix.app }}
          path: ${{ matrix.app }}/results/
